name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (iOS 17+)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          # 锁定到 runner 的 default Xcode（macos-14 上是 15.4），**不要取最高版本**。
          # 原因：chatlayout 2.4.3 声明 swift-tools-version:6.1，实测在 Xcode 16.2 上
          # 解析失败 —— "contains incompatible tools version (6.1.0)"。
          # 官方 v1.7.0 Release（2026-09-30）也是 default Xcode 编出来的。
          XCODE="${XCODE_PATH:-/Applications/Xcode.app}"
          if [ ! -d "$XCODE" ]; then
            echo "::error::default Xcode 不存在: $XCODE"; ls -1d /Applications/Xcode*.app; exit 1
          fi
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          java -version
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dsh-mobile.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build-xcodebuild.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" \
            || { echo "::error::xcodebuild produced no expected output"; tail -60 build-xcodebuild.log; exit 1; }
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="$(find build/dsh-mobile.xcarchive/Products -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP_DIR" ] || { echo "::error::no .app in archive"; exit 1; }
          ls -1 "$APP_DIR/PlugIns" 2>/dev/null || echo "(no PlugIns)"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_DIR" "build/ipa/Payload/$(basename "$APP_DIR")"
          (cd build/ipa && zip -qry ../dsh-mobile-unsigned.ipa Payload)
          ls -lh build/dsh-mobile-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-unsigned-ipa
          path: build/dsh-mobile-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
