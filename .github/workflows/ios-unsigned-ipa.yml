name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA (iOS 17+)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          set -euo pipefail
          # 用 macos-26 runner 的 default Xcode（26.6）。
          # 实测记录（勿回退，这几轮踩过的坑都记在这）：
          #   macos-14 / Xcode 15.4 → 路径错；Xcode 16.2 → SPM 拒收 chatlayout（tools 6.1）
          #   macos-15 / Xcode 16.4 → SPM 过了，但源码用了 iOS 26 API
          #     （Glass.swift 的 glassEffect、RootView 的 ToolbarSpacer、
          #      WorkspaceView 的 buttonSizing）⇒ 必须 Xcode 26
          XCODE="${XCODE_PATH:-/Applications/Xcode.app}"
          if [ ! -d "$XCODE" ]; then
            echo "::error::default Xcode 不存在: $XCODE"; ls -1d /Applications/Xcode*.app; exit 1
          fi
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # 源码使用 iOS 26 API，必须 Xcode 26+；镜像若降级 default 就在这里挡住，
          # 而不是等 8 分钟后拿一堆 API 缺失的编译错误。
          xcodebuild -version | grep -qE 'Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::需要 Xcode 26+，当前: $(xcodebuild -version | head -1)"; exit 1; }
          java -version
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/dsh-mobile.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            | tee build-xcodebuild.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" \
            || { echo "::error::xcodebuild produced no expected output"; tail -60 build-xcodebuild.log; exit 1; }
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="$(find build/dsh-mobile.xcarchive/Products -maxdepth 2 -name '*.app' -print -quit)"
          [ -n "$APP_DIR" ] || { echo "::error::no .app in archive"; exit 1; }
          ls -1 "$APP_DIR/PlugIns" 2>/dev/null || echo "(no PlugIns)"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP_DIR" "build/ipa/Payload/$(basename "$APP_DIR")"
          (cd build/ipa && zip -qry ../dsh-mobile-unsigned.ipa Payload)
          ls -lh build/dsh-mobile-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-unsigned-ipa
          path: build/dsh-mobile-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
